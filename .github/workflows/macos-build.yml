name: macos-build

on:
  pull_request:
    paths:
      - "neomacs-bin/**"
      - "neomacs-display/**"
      - "neovm-core/**"
      - "neovm-host-abi/**"
      - "neovm-worker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/macos-build.yml"
  push:
    branches:
      - main
    paths:
      - "neomacs-bin/**"
      - "neomacs-display/**"
      - "neovm-core/**"
      - "neovm-host-abi/**"
      - "neovm-worker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/macos-build.yml"

permissions:
  contents: read

jobs:
  rust-build-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            neovm-core
            neovm-worker

      - name: Check neovm-core
        run: |
          RUSTFLAGS='-Awarnings' cargo check \
            --manifest-path neovm-core/Cargo.toml \
            --no-default-features \
            --features core-backend-rust

      - name: Check neovm-worker
        run: |
          RUSTFLAGS='-Awarnings' cargo check \
            --manifest-path neovm-worker/Cargo.toml \
            --no-default-features \
            --features core-backend-rust
